<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta Digital | BCP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="wrap">
      <div class="header-top">
        <a class="logo" href="index.html"><img src="img/logo.svg" alt="BCP" /></a>
        <nav class="seg-nav"><a href="index.html">Personas</a><a href="pymes.html">Pymes</a><a href="empresas.html">Empresas</a></nav>
        <div class="header-actions">
          <button class="btn-search" type="button" data-open-search>Buscar</button>
          <a class="btn-banca" href="banca.html">Banca por Internet</a>
        </div>
      </div>
    </div>
  </header>
  <section class="page-hero">
    <div class="wrap">
      <h1>Abre tu Cuenta Digital</h1>
      <p>Sin comisiones de mantenimiento. 100% digital, en minutos.</p>
    </div>
  </section>
  <div class="panel">
    <form id="cuenta-form">
      <div class="field"><label>Nombres y apellidos</label><input required /></div>
      <div class="field"><label>DNI</label><input required maxlength="8" /></div>
      <div class="field"><label>Celular</label><input required /></div>
      <div class="field"><label>Correo</label><input type="email" required /></div>
      <div class="field">
        <label>Tipo de cuenta</label>
        <select>
          <option>Cuenta de ahorros soles</option>
          <option>Cuenta de ahorros dólares</option>
          <option>Cuenta corriente</option>
        </select>
      </div>
      <button class="btn-primary" type="submit">Continuar</button>
      <div id="cuenta-result" class="result"></div>
    </form>
  </div>
  <div class="overlay" id="search-modal"><div class="modal"><button class="close-x" data-close="search-modal">×</button><h3>Buscar</h3><input class="search-input" /></div></div>
  <script src="js/main.js"></script>
</body>
</html>
